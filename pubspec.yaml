name: correctis
description: "Correctis - Correction IA de copies par les enseignants (MVP)."
publish_to: 'none'
version: 1.0.64+71

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Localisation Material/Cupertino (datepickers, RefreshIndicator, etc.)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # UI / fonts
  google_fonts: ^6.2.1

  # Camera & image handling
  image_picker: ^1.1.2
  # C1 renforcé (Michel) : caméra custom pour scan burst sans confirmation
  # OK/Retry. Le prof appuie une fois sur "Scanner" puis prend plusieurs
  # photos d'affilée comme en mode rafale.
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  file_picker: ^8.1.4
  image: ^4.3.0  # Resize/compression d'images avant upload (Anthropic limite à 2000px max)

  # Files & exports
  excel: ^4.0.6
  share_plus: ^10.0.2
  open_filex: ^4.5.0
  pdf: ^3.11.1
  printing: ^5.13.4

  # Notifications locales (rappels invitations, copies prêtes, quota atteint)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # Local persistence (cache, préférences UI)
  shared_preferences: ^2.3.2

  # Backend : Supabase (auth, postgres, storage)
  supabase_flutter: ^2.8.0

  # Deep-links (correctis://invite?token=XXX, OAuth Google)
  app_links: ^6.3.2

  # QR Code pour invitations en présentiel (Admin → prof scanne avec son tél)
  qr_flutter: ^4.1.0

  # Ouverture de liens (mailto:, tel:, whatsapp://) — utilisé par SupportScreen
  url_launcher: ^6.3.1

  # Version + build number dynamiques (Michel : jamais hardcoder v1.0.x)
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# -----------------------------------------------------------------------------
# Configuration de l'icône de l'application (package flutter_launcher_icons).
# Placez le logo dans assets/icon/app_icon.png (1024x1024 recommandé), puis :
#   flutter pub get
#   dart run flutter_launcher_icons
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  # Icône adaptative Android (fond blanc + logo au centre)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false
  windows:
    generate: false

# -----------------------------------------------------------------------------
# Splash screen natif (écran affiché pendant le démarrage de l'app).
# Générer avec :
#   dart run flutter_native_splash:create
# -----------------------------------------------------------------------------
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/icon/app_icon.png
